name: project_trangdc24v7x324
description: App đặt thức ăn
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.3
  provider: ^6.0.5
  diacritic: ^0.1.6
  pocketbase: ^0.18.1
  image_picker: ^1.2.1
  shared_preferences: ^2.5.5
  http: ^1.2.1
  flutter_launcher_icons: ^0.14.4
  intl: ^0.19.0
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - images/splashScreen/
    - images/HomePage/
    - images/products/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "images/icons/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FF2D3D"
  adaptive_icon_foreground: "images/icons/app_icon.png"
